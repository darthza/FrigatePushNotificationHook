services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: frigate-listener-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - frigate-listener

  frigate-mqtt-push-listener:
    build: .
    container_name: frigate-mqtt-push-listener
    user: "${LISTENER_UID_GID:-1000:1000}"
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      DOTNET_ENVIRONMENT: Production
      Listener__DryRun: "${LISTENER_DRY_RUN:-true}"
      Push__Subject: "${PUSH_SUBJECT:-mailto:admin@example.com}"
      Mqtt__Host: "${MQTT_HOST:-mosquitto}"
      Mqtt__Port: "${MQTT_PORT:-1883}"
    volumes:
      - ./state:/app/state
      - ${FRIGATE_CONFIG_DIR:-/opt/frigate/config}:/frigate:ro
    networks:
      - frigate-listener

networks:
  frigate-listener:
    name: frigate-listener
